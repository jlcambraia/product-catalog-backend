name: Backend - validate demo security

on:
  push:
    branches:
      - feature/admin-auth-phase1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'feature/admin-auth-phase1' || github.head_ref }}
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Synchronize lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit updated lockfile to feature branch
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): synchronize backend lockfile for secure demo"
            git push origin HEAD:feature/admin-auth-phase1
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run backend tests
        run: npm test
